# ============================================================================
# >>> HOLDING CHATWOOT FORK — BUILD & PUBLISH IMAGEM <<<
# ============================================================================
#
# [2026-04-30] Workflow novo da holding pra buildar e publicar imagem Docker
# do nosso fork em ghcr.io/abckxopen/chatwoot. Não substitui workflows do
# upstream (publish_foss_docker.yml, publish_ee_docker.yml ficam intocados —
# eles publicam pra DockerHub chatwoot/chatwoot, irrelevante pra gente).
#
# Usar GHCR (não DockerHub) porque auth é automática via GITHUB_TOKEN, sem
# precisar criar/manter secret extra. Trocar quebra autenticação.
#
# Fluxo:
# - push de tag v*           → imagem ghcr.io/abckxopen/chatwoot:<tag-exata>
# - push em develop          → imagem ghcr.io/abckxopen/chatwoot:develop
#                              + tag rolling ghcr.io/abckxopen/chatwoot:latest
# - workflow_dispatch manual → permite testar build sem push pelos branches
#
# Mantém strip de `enterprise/` igual upstream FOSS — fork da holding é CE
# por enquanto. Se precisar EE no futuro, criar workflow separado.
# ============================================================================

name: holding · build & publish chatwoot

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag manual pra esta build (ex: v0.1.0-start-fork)'
        required: true
        default: 'manual-test'

env:
  # [2026-04-30] GHCR é registry GitHub Container — usa auth via GITHUB_TOKEN
  # automaticamente, sem secret extra. Trocar pra DockerHub volta a exigir
  # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # [2026-04-30] `packages: write` é obrigatório pro GITHUB_TOKEN poder
      # publicar em ghcr.io. Sem isso o push falha silenciosamente com 403.
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code (CE build)
        # [2026-04-30] Mesmo padrão do upstream publish_foss_docker.yml — fork
        # roda CE por enquanto. Se quiser EE no futuro, criar workflow novo
        # paralelo SEM esse strip.
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set CW_EDITION=ce no Dockerfile
        # [2026-04-30] Append exatamente como upstream FOSS faz (linha :50 do
        # publish_foss_docker.yml). Garante runtime label edition=ce — alguns
        # checks do app dependem dessa env.
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Compute image tags
        id: meta
        run: |
          # [2026-04-30] Estratégia de tagging:
          # - tag git v* → imagem com a tag git exata
          # - branch develop → imagem `develop` + `latest` (rolling)
          # - workflow_dispatch → input tag manual
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"   # ,, = lowercase obrigatório no GHCR
          TAGS=""

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${IMAGE}:${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "develop" ]]; then
            TAGS="${IMAGE}:develop,${IMAGE}:latest"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAGS="${IMAGE}:${{ inputs.tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          # log estruturado pra debug em CI
          echo "{\"event\":\"holding.ci.tags_computed\",\"tags\":\"${TAGS}\",\"image\":\"${IMAGE}\",\"ref\":\"${{ github.ref }}\"}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # [2026-04-30] Single platform linux/amd64 por enquanto — multi-arch
        # (linux/arm64) custa ~2x tempo de build. Adicionar quando confirmar
        # que algum host vai rodar arm. Trocar pra multi-arch requer também
        # split em jobs digest+merge igual upstream FOSS faz.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Chatwoot (abckxopen fork)
            org.opencontainers.image.vendor=Inteligência Avançada Holding
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log published tags
        run: |
          echo "{\"event\":\"holding.ci.published\",\"tags\":\"${{ steps.meta.outputs.tags }}\",\"sha\":\"${{ github.sha }}\"}"

  # ============================================================================
  # [2026-04-30] DEPLOY pro CORE (K3s da holding) — só roda em push tag v*.
  # Pattern reutilizado de mentoringbase/mentoringbase: SSH into manager-01
  # como cicd, rodar kubectl set image em web + worker (mesma imagem) +
  # initContainer db-migrate. Depois validar rollout, health check, rollback
  # automático em falha.
  #
  # Setup já feito no CORE:
  # - cicd@manager-01 com kubectl cluster-admin
  # - GH secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY
  # - ghcr-secret no ns chatwoot pra puxar imagem privada
  #
  # Tag schema enforced via regex pra evitar shell injection (ver step Validate).
  # ============================================================================
  deploy-core:
    needs: build-and-publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Validate tag format (anti-injection)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Aceita v[N].[N].[N] e variações com sufixo (v1.2.3-rc.1, v0.1.0-start-fork)
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Refusing unsupported tag format: $TAG"
            exit 1
          fi

      - name: Deploy to CORE via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: VERSION
          script: |
            set -e
            IMAGE="ghcr.io/abckxopen/chatwoot:${VERSION}"

            echo "=========================================="
            echo "  DEPLOY: Chatwoot (holding fork)"
            echo "  Image:     ${IMAGE}"
            echo "  Namespace: chatwoot"
            echo "=========================================="

            # Web: container chatwoot-web + initContainer db-migrate (mesma imagem,
            # roda bundle exec rails db:chatwoot_prepare antes do app)
            kubectl set image -n chatwoot deploy/chatwoot-web \
              chatwoot-web="${IMAGE}" db-migrate="${IMAGE}"

            # Worker: container chatwoot-worker (sem initContainer, mesma imagem,
            # roda bundle exec sidekiq)
            kubectl set image -n chatwoot deploy/chatwoot-worker \
              chatwoot-worker="${IMAGE}"

            kubectl rollout status -n chatwoot deploy/chatwoot-web --timeout=15m
            kubectl rollout status -n chatwoot deploy/chatwoot-worker --timeout=10m

            echo ""
            echo "--- Pods after rollout ---"
            kubectl get pods -n chatwoot \
              -l 'app in (chatwoot-web,chatwoot-worker)' \
              -o custom-columns='POD:.metadata.name,STATUS:.status.phase,IMAGE:.spec.containers[0].image'

      - name: Health check chat.abckx.com.br
        run: |
          # Tolerância: 12 tentativas a cada 10s (2 min total). Chatwoot reload
          # pode demorar pós-rollout, especialmente se rodar migrations grandes.
          for i in $(seq 1 12); do
            if curl -sf -o /dev/null -w "%{http_code}" https://chat.abckx.com.br/auth/sign_in | grep -qE "^(200|302)$"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i/12 failed, retrying..."
            sleep 10
          done
          echo "Health check failed after 12 attempts"
          exit 1

      - name: Auto-rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "Deploy ou health check falhou — revertendo web + worker"
            kubectl rollout undo -n chatwoot deploy/chatwoot-web
            kubectl rollout undo -n chatwoot deploy/chatwoot-worker
            kubectl rollout status -n chatwoot deploy/chatwoot-web --timeout=5m
            kubectl rollout status -n chatwoot deploy/chatwoot-worker --timeout=5m
