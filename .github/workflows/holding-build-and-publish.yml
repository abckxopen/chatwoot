# ============================================================================
# >>> HOLDING CHATWOOT FORK — BUILD & PUBLISH IMAGEM <<<
# ============================================================================
#
# [2026-04-30] Workflow novo da holding pra buildar e publicar imagem Docker
# do nosso fork em ghcr.io/abckxopen/chatwoot. Não substitui workflows do
# upstream (publish_foss_docker.yml, publish_ee_docker.yml ficam intocados —
# eles publicam pra DockerHub chatwoot/chatwoot, irrelevante pra gente).
#
# Usar GHCR (não DockerHub) porque auth é automática via GITHUB_TOKEN, sem
# precisar criar/manter secret extra. Trocar quebra autenticação.
#
# Fluxo:
# - push de tag v*           → imagem ghcr.io/abckxopen/chatwoot:<tag-exata>
# - push em develop          → imagem ghcr.io/abckxopen/chatwoot:develop
#                              + tag rolling ghcr.io/abckxopen/chatwoot:latest
# - workflow_dispatch manual → permite testar build sem push pelos branches
#
# Mantém strip de `enterprise/` igual upstream FOSS — fork da holding é CE
# por enquanto. Se precisar EE no futuro, criar workflow separado.
# ============================================================================

name: holding · build & publish chatwoot

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag manual pra esta build (ex: v0.1.0-start-fork)'
        required: true
        default: 'manual-test'

env:
  # [2026-04-30] GHCR é registry GitHub Container — usa auth via GITHUB_TOKEN
  # automaticamente, sem secret extra. Trocar pra DockerHub volta a exigir
  # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets.
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # [2026-04-30] `packages: write` é obrigatório pro GITHUB_TOKEN poder
      # publicar em ghcr.io. Sem isso o push falha silenciosamente com 403.
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code (CE build)
        # [2026-04-30] Mesmo padrão do upstream publish_foss_docker.yml — fork
        # roda CE por enquanto. Se quiser EE no futuro, criar workflow novo
        # paralelo SEM esse strip.
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise

      - name: Set CW_EDITION=ce no Dockerfile
        # [2026-04-30] Append exatamente como upstream FOSS faz (linha :50 do
        # publish_foss_docker.yml). Garante runtime label edition=ce — alguns
        # checks do app dependem dessa env.
        run: |
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Compute image tags
        id: meta
        run: |
          # [2026-04-30] Estratégia de tagging:
          # - tag git v* → imagem com a tag git exata
          # - branch develop → imagem `develop` + `latest` (rolling)
          # - workflow_dispatch → input tag manual
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"   # ,, = lowercase obrigatório no GHCR
          TAGS=""

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${IMAGE}:${{ github.ref_name }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "develop" ]]; then
            TAGS="${IMAGE}:develop,${IMAGE}:latest"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAGS="${IMAGE}:${{ inputs.tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          # log estruturado pra debug em CI
          echo "{\"event\":\"holding.ci.tags_computed\",\"tags\":\"${TAGS}\",\"image\":\"${IMAGE}\",\"ref\":\"${{ github.ref }}\"}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # [2026-04-30] Single platform linux/amd64 por enquanto — multi-arch
        # (linux/arm64) custa ~2x tempo de build. Adicionar quando confirmar
        # que algum host vai rodar arm. Trocar pra multi-arch requer também
        # split em jobs digest+merge igual upstream FOSS faz.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Chatwoot (abckxopen fork)
            org.opencontainers.image.vendor=Inteligência Avançada Holding
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log published tags
        run: |
          echo "{\"event\":\"holding.ci.published\",\"tags\":\"${{ steps.meta.outputs.tags }}\",\"sha\":\"${{ github.sha }}\"}"
